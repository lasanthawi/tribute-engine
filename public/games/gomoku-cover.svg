    <circle cx="195" cy="90" r="12" fill="#1a1a1a"/>
    <circle cx="230" cy="125" r="12" fill="#f5f5f5"/>
  </g>

  <text x="50%" y="320" font-family="sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">Gomoku Blitz</text>
  <text x="50%" y="345" font-family="sans-serif" font-size="18" font-weight="600" fill="#a3a8c2" text-anchor="middle">⚫ Connect 5 vs AI or a friend</text>
