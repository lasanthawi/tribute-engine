<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2b1f"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5be37a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5be37a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg3)"/>
  <rect width="640" height="360" fill="url(#glow3)"/>

  <!-- board -->
  <g transform="translate(170,40)">
    <rect width="300" height="180" rx="8" fill="#caa472"/>
    <g stroke="#5a3e22" stroke-width="2">
      <line x1="20" y1="20" x2="280" y2="20"/>
      <line x1="20" y1="55" x2="280" y2="55"/>
      <line x1="20" y1="90" x2="280" y2="90"/>
      <line x1="20" y1="125" x2="280" y2="125"/>
      <line x1="20" y1="160" x2="280" y2="160"/>
      <line x1="20" y1="20" x2="20" y2="160"/>
      <line x1="55" y1="20" x2="55" y2="160"/>
      <line x1="90" y1="20" x2="90" y2="160"/>
      <line x1="125" y1="20" x2="125" y2="160"/>
      <line x1="160" y1="20" x2="160" y2="160"/>
      <line x1="195" y1="20" x2="195" y2="160"/>
      <line x1="230" y1="20" x2="230" y2="160"/>
      <line x1="265" y1="20" x2="265" y2="160"/>
      <line x1="280" y1="20" x2="280" y2="160"/>
