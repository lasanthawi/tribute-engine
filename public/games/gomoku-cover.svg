    <circle cx="55" cy="55" r="12" fill="#1a1a1a"/>
    <circle cx="90" cy="55" r="12" fill="#1a1a1a"/>
    <circle cx="125" cy="55" r="12" fill="#1a1a1a"/>
    <circle cx="160" cy="55" r="12" fill="#1a1a1a"/>
    <circle cx="195" cy="55" r="12" fill="#f5f5f5"/>
    <circle cx="125" cy="90" r="12" fill="#f5f5f5"/>
