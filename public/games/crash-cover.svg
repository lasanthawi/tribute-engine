<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgCrash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071525"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glowCrash" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#29B6F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#29B6F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dangerGlow" cx="75%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#ff4d6a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff4d6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chartLine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#29B6F6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#29B6F6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff4d6a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29B6F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#29B6F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="rocketGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgCrash)"/>
  <rect width="640" height="360" fill="url(#glowCrash)"/>
  <rect width="640" height="360" fill="url(#dangerGlow)"/>

  <!-- subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="128" y1="0" x2="128" y2="360"/>
    <line x1="256" y1="0" x2="256" y2="360"/>
    <line x1="384" y1="0" x2="384" y2="360"/>
    <line x1="512" y1="0" x2="512" y2="360"/>
  </g>

  <!-- stars / particles -->
  <g fill="#ffffff">
    <circle cx="60" cy="30" r="1.2" opacity="0.5"/>
    <circle cx="130" cy="75" r="0.8" opacity="0.35"/>
    <circle cx="200" cy="45" r="1.5" opacity="0.4"/>
    <circle cx="310" cy="20" r="1" opacity="0.5"/>
    <circle cx="390" cy="55" r="0.9" opacity="0.3"/>
    <circle cx="490" cy="30" r="1.3" opacity="0.45"/>
    <circle cx="570" cy="70" r="0.8" opacity="0.35"/>
    <circle cx="610" cy="15" r="1.1" opacity="0.5"/>
    <circle cx="50" cy="130" r="0.7" opacity="0.3"/>
    <circle cx="170" cy="155" r="1" opacity="0.25"/>
    <circle cx="530" cy="110" r="0.8" opacity="0.35"/>
    <circle cx="620" cy="145" r="1" opacity="0.3"/>
  </g>

  <!-- multiplier chart fill -->
  <path d="M 60 260 Q 150 240 220 220 Q 310 195 370 165 Q 430 130 480 90 L 480 260 Z"
        fill="url(#chartFill)"/>

  <!-- multiplier chart line -->
  <path d="M 60 260 Q 150 240 220 220 Q 310 195 370 165 Q 430 130 480 90"
        fill="none" stroke="url(#chartLine)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- X axis tick labels -->
  <g fill="#a3a8c2" font-family="sans-serif" font-size="12" font-weight="600">
    <text x="60" y="278" text-anchor="middle">1.00x</text>
    <text x="220" y="278" text-anchor="middle">1.50x</text>
    <text x="370" y="278" text-anchor="middle">2.50x</text>
    <text x="480" y="278" text-anchor="middle">4.00x</text>
  </g>

  <!-- glowing dot at current multiplier peak -->
  <circle cx="480" cy="90" r="8" fill="#29B6F6" opacity="0.25"/>
  <circle cx="480" cy="90" r="5" fill="#29B6F6" opacity="0.6"/>
  <circle cx="480" cy="90" r="3" fill="#ffffff"/>

  <!-- rocket with glow, travelling up the chart -->
  <g filter="url(#rocketGlow)" transform="translate(460, 55) rotate(-35)">
    <text font-size="46" text-anchor="middle" dominant-baseline="middle">🚀</text>
  </g>

  <!-- danger flash at top right -->
  <circle cx="560" cy="60" r="28" fill="#ff4d6a" opacity="0.12"/>
  <circle cx="560" cy="60" r="18" fill="#ff4d6a" opacity="0.18"/>
  <text x="560" y="67" font-family="sans-serif" font-size="26" text-anchor="middle" dominant-baseline="middle" opacity="0.85">💥</text>

  <!-- live multiplier badge -->
  <rect x="50" y="72" width="110" height="36" rx="8" fill="#29B6F6" opacity="0.15"/>
  <rect x="50" y="72" width="110" height="36" rx="8" fill="none" stroke="#29B6F6" stroke-width="1.5" opacity="0.5"/>
  <text x="105" y="97" font-family="sans-serif" font-size="20" font-weight="800" fill="#29B6F6" text-anchor="middle">3.84x 🔴</text>

  <rect width="640" height="140" y="220" fill="url(#vignette)"/>

  <text x="50%" y="310" font-family="sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">Rocket Cash Out</text>
  <text x="50%" y="340" font-family="sans-serif" font-size="18" font-weight="600" fill="#a3a8c2" text-anchor="middle">📈 Cash out before the rocket explodes</text>
</svg>
