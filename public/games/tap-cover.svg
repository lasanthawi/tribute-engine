<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f33"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- falling coins -->
  <circle cx="120" cy="80" r="34" fill="#F7931A"/>
  <text x="120" y="92" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">₿</text>

  <circle cx="320" cy="140" r="44" fill="#627EEA"/>
  <text x="320" y="155" font-family="sans-serif" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">Ξ</text>

  <circle cx="500" cy="90" r="30" fill="#0098EA"/>
  <text x="500" y="101" font-family="sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">◆</text>

  <circle cx="220" cy="270" r="26" fill="#F7931A" opacity="0.85"/>
  <text x="220" y="280" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">₿</text>

  <circle cx="450" cy="250" r="22" fill="#0098EA" opacity="0.85"/>
  <text x="450" y="258" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">◆</text>

  <text x="50%" y="320" font-family="sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">Coin Catcher</text>
  <text x="50%" y="345" font-family="sans-serif" font-size="18" font-weight="600" fill="#a3a8c2" text-anchor="middle">🪙 Tap the falling coins</text>
</svg>
